name: Deploy React Frontend to S3

on:
  push:
    branches:
      - main
    paths:
      - 'frontend/**'   # Only triggers when frontend files change
  workflow_dispatch:     # Allows manual trigger from GitHub Actions UI

jobs:
  build-and-deploy:
    name: Build & Deploy to S3
    runs-on: ubuntu-latest

    steps:
      # ── 1. Checkout code ──────────────────────────────────────────
      - name: Checkout repository
        uses: actions/checkout@v4

      # ── 2. Set up Node.js ─────────────────────────────────────────
      - name: Set up Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      # ── 3. Install dependencies ───────────────────────────────────
      - name: Install dependencies
        working-directory: frontend
        run: npm ci

      # ── 4. Build React app ────────────────────────────────────────
      - name: Build React app
        working-directory: frontend
        run: npm run build
        env:
          CI: false   # Prevents warnings being treated as errors

      # ── 5. Configure AWS credentials ──────────────────────────────
      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-session-token: ${{ secrets.AWS_SESSION_TOKEN }}
          aws-region: us-east-1

      # ── 6. Deploy static assets to S3 (with long cache) ───────────
      - name: Deploy static assets to S3
        run: |
          aws s3 sync frontend/build/ s3://${{ secrets.S3_BUCKET_NAME }} \
            --delete \
            --cache-control "public, max-age=31536000" \
            --exclude "index.html"

      # ── 7. Deploy index.html with no-cache ────────────────────────
      - name: Deploy index.html (no-cache)
        run: |
          aws s3 cp frontend/build/index.html \
            s3://${{ secrets.S3_BUCKET_NAME }}/index.html \
            --cache-control "no-cache, no-store, must-revalidate" \
            --content-type "text/html"

      # ── 8. Print live URL ─────────────────────────────────────────
      - name: Deployment complete
        run: |
          echo "=============================================="
          echo "✅ Frontend deployed successfully!"
          echo ""
          echo "🌍 Live URL:"
          echo "http://${{ secrets.S3_BUCKET_NAME }}.s3-website-us-east-1.amazonaws.com"
          echo ""
          echo "🔗 API Gateway:"
          echo "https://ysp58cr2xc.execute-api.us-east-1.amazonaws.com"
          echo ""
          echo "📚 API Docs:"
          echo "https://ysp58cr2xc.execute-api.us-east-1.amazonaws.com/docs"
          echo "=============================================="
