name: Deploy React Frontend to S3

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  build-and-deploy:
    name: Build & Deploy to S3
    runs-on: ubuntu-latest

    steps:
      # ── 1. Checkout (full history needed for SonarCloud) ──────────
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0   # Required by SonarCloud for blame info

      # ── 2. Set up Node.js ─────────────────────────────────────────
      - name: Set up Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      # ── 3. Install dependencies ───────────────────────────────────
      - name: Install dependencies
        working-directory: frontend
        run: npm install

      # ── 4. Build React app ────────────────────────────────────────
      - name: Build React app
        working-directory: frontend
        run: npm run build
        env:
          CI: false

      # ── 5. SonarCloud Analysis ────────────────────────────────────
      - name: SonarCloud Scan
        uses: SonarSource/sonarcloud-github-action@master
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}

      # ── 6. Configure AWS credentials ──────────────────────────────
      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-session-token: ${{ secrets.AWS_SESSION_TOKEN }}
          aws-region: us-east-1

      # ── 7. Deploy static assets to S3 ─────────────────────────────
      - name: Deploy static assets to S3
        run: |
          aws s3 sync frontend/build/ s3://${{ secrets.S3_BUCKET_NAME }} \
            --delete \
            --cache-control "public, max-age=31536000" \
            --exclude "index.html"

      # ── 8. Deploy index.html with no-cache ────────────────────────
      - name: Deploy index.html with no-cache
        run: |
          aws s3 cp frontend/build/index.html \
            s3://${{ secrets.S3_BUCKET_NAME }}/index.html \
            --cache-control "no-cache, no-store, must-revalidate" \
            --content-type "text/html"

      # ── 9. Print live URL ─────────────────────────────────────────
      - name: Deployment complete
        run: |
          echo "✅ Deployed to: http://${{ secrets.S3_BUCKET_NAME }}.s3-website-us-east-1.amazonaws.com"